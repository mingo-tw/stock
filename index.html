<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產配置與走勢追蹤</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0A0E17;
    --surface:#131926;
    --surface-2:#171F30;
    --border:#232B3D;
    --text:#E8EAED;
    --text-dim:#8B93A7;
    --gain:#E5484D;
    --loss:#2FB380;
    --accent:#C9A227;
    --equity:#C9A227;
    --bond:#5B8DEF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    padding:28px 16px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  h1{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .subtitle{color:var(--text-dim);font-size:13.5px;margin:0 0 28px;}

  .hero{
    background:linear-gradient(160deg,var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px 24px;
    margin-bottom:20px;
  }
  .hero-label{color:var(--text-dim);font-size:13px;margin-bottom:6px;}
  .hero-value{
    font-family:'Newsreader',serif;
    font-size:44px;
    font-weight:600;
    line-height:1.1;
  }
  .hero-row{display:flex;gap:32px;flex-wrap:wrap;margin-top:16px;}
  .hero-stat{font-size:13.5px;color:var(--text-dim);}
  .hero-stat b{color:var(--text);font-weight:600;display:block;font-size:16px;margin-top:2px;}
  .delta-up{color:var(--gain);}
  .delta-down{color:var(--loss);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  @media (max-width:720px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }
  .card-title{font-size:14.5px;font-weight:600;margin:0 0 14px;color:var(--text);}
  .card-sub{font-size:12px;color:var(--text-dim);margin:-10px 0 14px;}

  .legend-row{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}

  .fx-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--text-dim);flex-wrap:wrap;}
  .fx-row input{
    width:80px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:5px 8px;font-size:13px;font-family:inherit;
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:right;color:var(--text-dim);font-weight:500;font-size:11.5px;
    padding:6px 8px;border-bottom:1px solid var(--border);
  }
  th:first-child,td:first-child{text-align:left;}
  td{padding:8px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .name{font-weight:500;}
  .code{color:var(--text-dim);font-size:11px;display:block;}
  .tag{
    display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;
    vertical-align:middle;font-weight:600;
  }
  .tag-equity{background:rgba(201,162,39,0.15);color:var(--equity);}
  .tag-bond{background:rgba(91,141,239,0.15);color:var(--bond);}
  
  input.price-input, input.qty-input, input.avgcost-input{
    width:88px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:5px 8px;font-size:13px;
    text-align:right;font-family:inherit;
  }
  input.price-input:focus, input.qty-input:focus, input.avgcost-input:focus{
    outline:1px solid var(--accent);
  }
  .remove-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;
    padding:2px 6px;border-radius:6px;line-height:1;
  }
  .remove-btn:hover{color:var(--gain);background:rgba(229,72,77,0.1);}

  .section-heading{
    font-size:13px;color:var(--text-dim);margin:22px 0 8px;font-weight:600;
  }
  .section-heading:first-child{margin-top:0;}

  .add-row{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    background:var(--surface-2);border:1px dashed var(--border);
    border-radius:10px;padding:12px;margin-top:10px;font-size:12.5px;
  }
  .add-row input, .add-row select{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit;
  }
  .add-row input[type=text]{width:90px;}
  .add-row input[type=number]{width:85px;}
  .add-row label{color:var(--text-dim);font-size:11px;display:flex;flex-direction:column;gap:3px;}

  .btnrow{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:13.5px;font-weight:600;
    border-radius:8px;padding:10px 18px;cursor:pointer;border:none;
  }
  .btn-primary{background:var(--accent);color:#191305;}
  .btn-primary:hover{background:#d8b12e;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-small{padding:6px 12px;font-size:12.5px;}
  .save-msg{font-size:12.5px;color:var(--accent);}

  .bar-container{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--surface-2);margin-top:15px;}
  .bar-segment{height:100%;transition:width .3s;}

  .history-list{max-height:200px;overflow-y:auto;font-size:13px;}
  .history-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);}
  .history-row:last-child{border-bottom:none;}
  .history-date{color:var(--text-dim);}
</style>
</head>
<body>
<div class="wrap">

  <h1>資產配置與走勢</h1>
  <p class="subtitle">台股 + 美股持倉整合檢視 · 自動填入隔離修正版</p>

  <div class="hero">
    <div class="hero-label">總資產淨值（換算新台幣）</div>
    <div class="hero-value" id="heroTotal">—</div>
    <div class="hero-row">
      <div class="hero-stat">較上次週快照<b id="deltaSinceLast">—</b></div>
      <div class="hero-stat">未實現損益<b id="totalPnl">—</b></div>
      <div class="hero-stat">已記錄週數<b id="snapshotCount">0</b></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card" style="margin-bottom:0;">
      <div class="card-title">資產配置 — 股票 vs 債券</div>
      <div id="allocText" style="font-size:20px;font-weight:600;margin-top:10px;color:var(--text);">股票 —% · 債券 —%</div>
      <div class="bar-container" id="allocBar">
        <div class="bar-segment" id="equityBar" style="background:var(--equity);width:50%;"></div>
        <div class="bar-segment" id="bondBar" style="background:var(--bond);width:50%;"></div>
      </div>
      <div class="legend-row">
        <span><span class="legend-dot" style="background:var(--equity);"></span>股票 / 股票型 ETF</span>
        <span><span class="legend-dot" style="background:var(--bond);"></span>債券 / 債券型 ETF</span>
      </div>
    </div>

    <div class="card" style="margin-bottom:0;">
      <div class="card-title">資產比例明細</div>
      <div class="card-sub" id="equityValText">股票總額：NT$ —</div>
      <div class="card-sub" id="bondValText">債券總額：NT$ —</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">持倉明細</div>
    
    <div class="fx-row">
      美元兌台幣匯率
      <input type="number" id="fxRate" value="31.5" step="0.01" autocomplete="off" data-lpignore="true">
      <span style="color:var(--text-dim);font-size:12px;">（用於將美股帳戶換算為台幣）</span>
    </div>

    <div class="btnrow" style="margin-top:0;margin-bottom:18px;">
      <button class="btn-primary" id="refreshBtn" type="button">🔄 線上聯網更新最新股價</button>
      <span class="save-msg" id="refreshStatus" style="color:var(--text-dim);">點擊上方按鈕可線上抓取台美股最新市價</span>
    </div>

    <div class="section-heading"><span>台股帳戶（新台幣）</span></div>
    <table>
      <thead>
        <tr>
          <th>標的</th>
          <th>股數</th>
          <th>平均成本</th>
          <th>現價</th>
          <th>市值</th>
          <th>損益</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="twBody"></tbody>
    </table>
    <div class="add-row">
      <label>代號<input type="text" id="twAddCode" placeholder="0050" autocomplete="off"></label>
      <label>名稱<input type="text" id="twAddName" placeholder="元大台灣50" autocomplete="off"></label>
      <label>股數<input type="number" id="twAddQty" step="any" placeholder="1000" autocomplete="off"></label>
      <label>平均成本<input type="number" id="twAddAvgCost" step="any" placeholder="平均成本" autocomplete="off"></label>
      <label>現價<input type="number" id="twAddPrice" step="any" placeholder="現價" autocomplete="off"></label>
      <label>類別
        <select id="twAddCategory"><option value="equity">股票</option><option value="bond">債券</option></select>
      </label>
      <button class="btn-ghost btn-small" id="twAddBtn" type="button" style="align-self:flex-end;">＋ 新增台股</button>
    </div>

    <div class="section-heading" style="margin-top:26px;"><span>美股帳戶（美元）</span></div>
    <table>
      <thead>
        <tr>
          <th>標的</th>
          <th>股數/口數</th>
          <th>平均成本</th>
          <th>現價</th>
          <th>市值</th>
          <th>損益</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="usBody"></tbody>
    </table>
    <div class="add-row">
      <label>代號 Ticker<input type="text" id="usAddCode" placeholder="AAPL" autocomplete="off"></label>
      <label>股數<input type="number" id="usAddQty" step="any" placeholder="10" autocomplete="off"></label>
      <label>平均成本<input type="number" id="usAddAvgCost" step="any" placeholder="平均成本" autocomplete="off"></label>
      <label>現價<input type="number" id="usAddPrice" step="any" placeholder="現價" autocomplete="off"></label>
      <label>類別
        <select id="usAddCategory"><option value="equity">股票</option><option value="bond">債券</option></select>
      </label>
      <button class="btn-ghost btn-small" id="usAddBtn" type="button" style="align-self:flex-end;">＋ 新增美股</button>
    </div>

    <div class="btnrow">
      <button class="btn-primary" id="updateAndSaveAllBtn" type="button">💾 儲存所有修改</button>
      <button class="btn-ghost" id="snapshotBtn" type="button">手動記錄本週快照</button>
      <button class="btn-ghost" id="resetBtn" type="button">還原預設資料</button>
      <span class="save-msg" id="saveMsg" style="opacity:0;transition:opacity .3s;">已成功儲存修改！</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">週快照歷史紀錄</div>
    <div class="history-list" id="historyList">
      <div style="color:var(--text-dim);font-size:12.5px;text-align:center;padding:12px;">尚未記錄任何歷史快照</div>
    </div>
  </div>

</div>

<script>
const fmt = n => Math.round(n).toLocaleString('en-US');
function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const INITIAL_STATE = {
  fx: 31.5,
  tw: [
    { id:'seed-tw-0', name:'元大台灣50', code:'0050', qty:49533, avgCost:42.63, price:106.69, category:'equity' },
    { id:'seed-tw-1', name:'國泰20年美債', code:'00687B', qty:32390, avgCost:27.57, price:27.15, category:'bond' },
    { id:'seed-tw-2', name:'群益ESG投等債20+', code:'00937B', qty:10510, avgCost:12.87, price:14.32, category:'bond' },
    { id:'seed-tw-3', name:'凱基台灣TOP50', code:'009816', qty:12648, avgCost:13.93, price:15.55, category:'equity' },
    { id:'seed-tw-4', name:'台積電', code:'2330', qty:2200, avgCost:540.78, price:2409.29, category:'equity' },
    { id:'seed-tw-5', name:'永豐金', code:'2890', qty:39200, avgCost:16.06, price:39.62, category:'equity' },
    { id:'seed-tw-6', name:'聯亞', code:'3081', qty:750, avgCost:1900.37, price:3290.40, category:'equity' },
  ],
  us: [
    { id:'seed-us-0', name:'NVDA', code:'NVDA', qty:0.00218, avgCost:128.44, price:217.89, category:'equity' },
    { id:'seed-us-1', name:'SMCI', code:'SMCI', qty:400, avgCost:44.43, price:37.08, category:'equity' },
    { id:'seed-us-2', name:'SMCX', code:'SMCX', qty:5400, avgCost:22.32, price:11.81, category:'equity' },
    { id:'seed-us-3', name:'TLT', code:'TLT', qty:0.73778, avgCost:85.13, price:82.94, category:'bond' },
    { id:'seed-us-4', name:'TLT Call', code:'', qty:3, avgCost:60.69, price:45.00, category:'bond', note:'10/16/26 $85 x3' },
    { id:'seed-us-5', name:'VT', code:'VT', qty:350, avgCost:140.60, price:161.12, category:'equity' },
  ]
};

let state = JSON.parse(JSON.stringify(INITIAL_STATE));
let history = [];

function syncInputsToState(){
  ['tw', 'us'].forEach(market => {
    state[market].forEach(h => {
      const tr = document.querySelector(`tr[data-tr-id="${h.id}"]`);
      if(tr){
        const qEl = tr.querySelector('.qty-input');
        const cEl = tr.querySelector('.avgcost-input');
        const pEl = tr.querySelector('.price-input');
        
        if(qEl && qEl.value !== '') h.qty = parseFloat(qEl.value) || 0;
        if(cEl && cEl.value !== '') h.avgCost = parseFloat(cEl.value) || 0;
        if(pEl && pEl.value !== '') h.price = parseFloat(pEl.value) || 0;
      }
    });
  });
  const fxEl = document.getElementById('fxRate');
  if(fxEl) state.fx = parseFloat(fxEl.value) || 31.5;
}

function computeTotals(){
  const fx = state.fx;
  let twValue=0, twCost=0, usValueUSD=0, usCostUSD=0;
  let equityTWD=0, bondTWD=0;

  state.tw.forEach(h=>{ 
    h.value = h.qty * h.price; 
    h.cost = h.qty * (h.avgCost || 0);
    twValue += h.value; 
    twCost += h.cost; 
    if(h.category === 'bond') bondTWD += h.value; else equityTWD += h.value;
  });
  
  state.us.forEach(h=>{ 
    h.value = h.qty * h.price; 
    h.cost = h.qty * (h.avgCost || 0);
    usValueUSD += h.value; 
    usCostUSD += h.cost; 
    const valTWD = h.value * fx;
    if(h.category === 'bond') bondTWD += valTWD; else equityTWD += valTWD;
  });

  const totalValue = twValue + usValueUSD * fx;
  const totalCost = twCost + usCostUSD * fx;
  return { twValue, twCost, usValueUSD, usCostUSD, totalValue, totalCost, equityTWD, bondTWD };
}

function renderTable(bodyId, holdings, currencySymbol, market){
  const body = document.getElementById(bodyId);
  body.innerHTML = '';
  if(!holdings.length){
    body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:12px;">尚無持倉</td></tr>`;
    return;
  }
  holdings.forEach((h)=>{
    const cost = h.qty * (h.avgCost || 0);
    const pnl = h.value - cost;
    const pnlPct = cost ? (pnl / cost * 100) : 0;
    const pnlClass = pnl >= 0 ? 'delta-up' : 'delta-down';
    const tagClass = h.category === 'bond' ? 'tag-bond' : 'tag-equity';
    const tagLabel = h.category === 'bond' ? '債券' : '股票';
    const codeLine = h.note ? h.note : h.code;
    
    const tr = document.createElement('tr');
    tr.setAttribute('data-tr-id', h.id);
    tr.innerHTML = `
      <td><span class="name">${h.name}</span><span class="tag ${tagClass}">${tagLabel}</span>${codeLine?`<span class="code">${codeLine}</span>`:''}</td>
      <td style="text-align:right;"><input class="qty-input" type="number" step="any" min="0" value="${h.qty}" data-market="${market}" data-id="${h.id}" name="qty_${h.id}" autocomplete="new-password" data-lpignore="true"></td>
      <td style="text-align:right;"><input class="avgcost-input" type="number" step="any" min="0" value="${h.avgCost || 0}" data-market="${market}" data-id="${h.id}" name="cost_${h.id}" autocomplete="new-password" data-lpignore="true"></td>
      <td style="text-align:right;"><input class="price-input" type="number" step="any" value="${h.price}" data-market="${market}" data-id="${h.id}" name="price_${h.id}" autocomplete="new-password" data-lpignore="true"></td>
      <td style="text-align:right;" class="val-cell">${currencySymbol}${fmt(h.value)}</td>
      <td style="text-align:right;" class="pnl-cell ${pnlClass}">${pnl>=0?'+':''}${fmt(pnl)} (${pnlPct.toFixed(1)}%)</td>
      <td style="text-align:right;"><button class="remove-btn" type="button" data-market="${market}" data-id="${h.id}">✕</button></td>
    `;
    body.appendChild(tr);
  });
}

function updateCalculatedDisplays(){
  const totals = computeTotals();

  ['tw', 'us'].forEach(market => {
    const symbol = market === 'tw' ? 'NT$' : '$';
    state[market].forEach(h => {
      const tr = document.querySelector(`tr[data-tr-id="${h.id}"]`);
      if(tr){
        const cost = h.qty * (h.avgCost || 0);
        const pnl = h.value - cost;
        const pnlPct = cost ? (pnl / cost * 100) : 0;
        const pnlClass = pnl >= 0 ? 'delta-up' : 'delta-down';
        
        const valCell = tr.querySelector('.val-cell');
        const pnlCell = tr.querySelector('.pnl-cell');
        if(valCell) valCell.textContent = `${symbol}${fmt(h.value)}`;
        if(pnlCell){
          pnlCell.textContent = `${pnl>=0?'+':''}${fmt(pnl)} (${pnlPct.toFixed(1)}%)`;
          pnlCell.className = `pnl-cell ${pnlClass}`;
        }
      }
    });
  });

  document.getElementById('heroTotal').textContent = 'NT$ ' + fmt(totals.totalValue);
  const pnl = totals.totalValue - totals.totalCost;
  const pnlEl = document.getElementById('totalPnl');
  pnlEl.textContent = (pnl>=0?'+':'') + 'NT$' + fmt(pnl);
  pnlEl.className = pnl>=0 ? 'delta-up':'delta-down';

  const lastSnapshot = history.length ? history[history.length-1] : null;
  const deltaEl = document.getElementById('deltaSinceLast');
  if(lastSnapshot){
    const d = totals.totalValue - lastSnapshot.totalValue;
    deltaEl.textContent = (d>=0?'+':'') + 'NT$' + fmt(d);
    deltaEl.className = d>=0 ? 'delta-up':'delta-down';
  } else {
    deltaEl.textContent = '無快照';
  }

  const eqPct = totals.totalValue ? (totals.equityTWD / totals.totalValue * 100) : 0;
  const bdPct = totals.totalValue ? (totals.bondTWD / totals.totalValue * 100) : 0;
  
  document.getElementById('allocText').textContent = `股票 ${eqPct.toFixed(1)}% · 債券 ${bdPct.toFixed(1)}%`;
  document.getElementById('equityBar').style.width = `${eqPct}%`;
  document.getElementById('bondBar').style.width = `${bdPct}%`;
  
  document.getElementById('equityValText').textContent = `股票總額：NT$ ${fmt(totals.equityTWD)}`;
  document.getElementById('bondValText').textContent = `債券總額：NT$ ${fmt(totals.bondTWD)}`;
}

function fullRender(){
  renderTable('twBody', state.tw, 'NT$', 'tw');
  renderTable('usBody', state.us, '$', 'us');
  updateCalculatedDisplays();
  renderHistory();
}

function renderHistory(){
  const list = document.getElementById('historyList');
  document.getElementById('snapshotCount').textContent = history.length;
  if(!history.length){
    list.innerHTML = `<div style="color:var(--text-dim);font-size:12.5px;text-align:center;padding:12px;">尚未記錄任何歷史快照</div>`;
    return;
  }
  list.innerHTML = history.slice().reverse().map(s => `
    <div class="history-row">
      <span class="history-date">${s.date}</span>
      <b>NT$ ${fmt(s.totalValue)}</b>
    </div>
  `).join('');
}

function saveState(){ 
  syncInputsToState();
  localStorage.setItem('asset_state', JSON.stringify(state)); 
  localStorage.setItem('asset_history', JSON.stringify(history)); 
}

function loadState(){
  try{ 
    const rawState = localStorage.getItem('asset_state');
    const rawHist = localStorage.getItem('asset_history');
    if(rawState) state = JSON.parse(rawState);
    if(rawHist) history = JSON.parse(rawHist);
  }catch(e){}
}

document.addEventListener('input', (e)=>{
  const target = e.target;
  if(target.classList.contains('price-input') || target.classList.contains('qty-input') || target.classList.contains('avgcost-input')){
    syncInputsToState();
    updateCalculatedDisplays();
  } else if(target.id === 'fxRate'){
    syncInputsToState();
    updateCalculatedDisplays();
  }
});

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  syncInputsToState();
  const statusEl = document.getElementById('refreshStatus');
  statusEl.textContent = '⏳ 正在線上更新最新股價中...';
  
  try {
    for(let h of state.us){
      if(!h.code) continue;
      try{
        const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${h.code}`);
        const data = await res.json();
        const meta = data?.chart?.result?.[0]?.meta;
        if(meta && meta.regularMarketPrice){
          h.price = meta.regularMarketPrice;
        }
      }catch(e){}
    }

    for(let h of state.tw){
      if(!h.code) continue;
      try{
        const symbol = h.code.length === 4 || h.code.length === 6 ? `${h.code}.TW` : h.code;
        const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`);
        const data = await res.json();
        const meta = data?.chart?.result?.[0]?.meta;
        if(meta && meta.regularMarketPrice){
          h.price = meta.regularMarketPrice;
        }
      }catch(e){}
    }

    saveState();
    fullRender();
    statusEl.textContent = '✅ 最新股價已成功更新！';
  } catch(e) {
    statusEl.textContent = '⚠️ 部分股價線上抓取失敗，請手動校正價格。';
  }
  setTimeout(()=> statusEl.textContent = '點擊上方按鈕可線上抓取台美股最新市價', 3000);
});

document.getElementById('twAddBtn').addEventListener('click', ()=>{
  syncInputsToState();
  const code = document.getElementById('twAddCode').value.trim();
  const name = document.getElementById('twAddName').value.trim() || code;
  const qty = parseFloat(document.getElementById('twAddQty').value) || 0;
  const avgCost = parseFloat(document.getElementById('twAddAvgCost').value) || 0;
  const price = parseFloat(document.getElementById('twAddPrice').value) || 0;
  const category = document.getElementById('twAddCategory').value;
  if(!code || !qty){ alert('請填寫代號與股數'); return; }

  state.tw.push({ id:uid('tw'), name, code, qty, avgCost, price, category });
  saveState(); fullRender();
  ['twAddCode','twAddName','twAddQty','twAddAvgCost','twAddPrice'].forEach(id=>document.getElementById(id).value='');
});

document.getElementById('usAddBtn').addEventListener('click', ()=>{
  syncInputsToState();
  const code = document.getElementById('usAddCode').value.trim().toUpperCase();
  const qty = parseFloat(document.getElementById('usAddQty').value) || 0;
  const avgCost = parseFloat(document.getElementById('usAddAvgCost').value) || 0;
  const price = parseFloat(document.getElementById('usAddPrice').value) || 0;
  const category = document.getElementById('usAddCategory').value;
  if(!code || !qty){ alert('請填寫 Ticker 與股數'); return; }

  state.us.push({ id:uid('us'), name:code, code, qty, avgCost, price, category });
  saveState(); fullRender();
  ['usAddCode','usAddQty','usAddAvgCost','usAddPrice'].forEach(id=>document.getElementById(id).value='');
});

document.addEventListener('click', (e)=>{
  if(e.target.classList.contains('remove-btn')){
    const market = e.target.dataset.market;
    const id = e.target.dataset.id;
    if(confirm('確定要移除這筆持倉嗎？')){
      syncInputsToState();
      state[market] = state[market].filter(h=>h.id!==id);
      saveState(); fullRender();
    }
  }
});

document.getElementById('snapshotBtn').addEventListener('click', ()=>{
  saveState();
  const totals = computeTotals();
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  history.push({ date: dateStr, totalValue: totals.totalValue });
  saveState();
  fullRender();
  alert('已成功新增本週快照記錄！');
});

document.getElementById('updateAndSaveAllBtn').addEventListener('click', ()=>{
  saveState();
  fullRender();
  const msg = document.getElementById('saveMsg');
  msg.style.opacity = 1;
  setTimeout(()=>msg.style.opacity = 0, 2000);
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('確定要還原成預設資料嗎？')){
    state = JSON.parse(JSON.stringify(INITIAL_STATE));
    history = [];
    localStorage.removeItem('asset_state');
    localStorage.removeItem('asset_history');
    fullRender();
  }
});

(function init(){
  loadState();
  document.getElementById('fxRate').value = state.fx || 31.5;
  fullRender();
})();
</script>
</body>
</html>
