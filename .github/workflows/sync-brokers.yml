name: 同步券商持倉

on:
  schedule:
    # GitHub 用 UTC 時間。週一~五：
    - cron: "40 6 * * 1-5"   # 台灣 14:40（台股收盤後）
    - cron: "30 21 * * 1-5"  # 台灣隔天 05:30（美股收盤後）
  workflow_dispatch:          # 可在 Actions 頁面手動按「Run workflow」
    inputs:
      only:
        description: "只同步某市場（留空=全部，tw / us）"
        required: false
        default: ""

concurrency:
  group: sync-brokers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Sync
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          FT_USERNAME: ${{ secrets.FT_USERNAME }}
          FT_PASSWORD: ${{ secrets.FT_PASSWORD }}
          FT_MFA_SECRET: ${{ secrets.FT_MFA_SECRET }}
          FT_PIN: ${{ secrets.FT_PIN }}
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SEC_KEY: ${{ secrets.SJ_SEC_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python sync/sync_holdings.py --only "${{ github.event.inputs.only }}"
          else
            python sync/sync_holdings.py
          fi
