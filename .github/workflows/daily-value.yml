name: 每日資產紀錄

on:
  schedule:
    # GitHub 用 UTC 時間，每天兩次：
    - cron: "10 7 * * *"    # 台灣 15:10（台股收盤後）
    - cron: "40 22 * * *"   # 台灣隔天 06:40（美股收盤後）
  workflow_dispatch:          # 可在 Actions 頁面手動按「Run workflow」

concurrency:
  group: sync-brokers
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 更新股價並記錄今日資產
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
        run: |
          if [ -z "$JSONBIN_MASTER_KEY" ]; then
            echo "尚未設定 JSONBIN_BIN_ID / JSONBIN_MASTER_KEY 這兩個 Secrets，略過。"
            exit 0
          fi
          python sync/daily_value.py
